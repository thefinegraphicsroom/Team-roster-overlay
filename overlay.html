<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IQOO Soul – Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Bakbak+One&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;display:flex;align-items:flex-start;justify-content:flex-start;width:2217px;height:250px;overflow:hidden;font-family:'Bakbak One',sans-serif}

/* ══ OVERLAY ══ */
.overlay{position:relative;width:1823px;height:250px;background:#241630;overflow:hidden;flex-shrink:0}
.overlay-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;pointer-events:none;z-index:0}
.overlay.has-bg-img .overlay-bg-img{display:block}
.panel-left,.panel-right,.team-logo,.team-name-el,.team-lineup-el,#playersRoot{position:absolute;z-index:1}
.panel-left{left:28px;top:25px;width:285px;height:200px;background:#09060D;border-radius:5px 0 0 5px;-webkit-mask-image:linear-gradient(to right,#000 80%,transparent 50%);mask-image:linear-gradient(to right,#000 80%,transparent 100%);overflow:hidden}
.panel-right{left:305px;top:25px;width:1473px;height:200px;background:#09060D;border-radius:0 5px 5px 0;-webkit-mask-image:linear-gradient(to left,#000 97%,transparent 50%);mask-image:linear-gradient(to left,#000 97%,transparent 100%);overflow:hidden}
.panel-left .panel-img,.panel-right .panel-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.panel-left.has-img .panel-img,.panel-right.has-img .panel-img{display:block}

.content-fade{position:absolute;inset:0;z-index:2;transition:opacity 0.5s ease}
.content-fade.fading{opacity:0}

.team-logo{left:52px;top:44px;width:100px;height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.team-logo img.logo-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
.team-logo.has-img .logo-img{display:block}

.team-name-el{left:52px;top:140px;width:200px;height:40px;display:flex;align-items:center}
.team-name-el .team-name-text{font-family:'Anton SC',sans-serif;font-size:27px;color:#5918E3;line-height:1;text-transform:uppercase;white-space:nowrap}
.team-lineup-el{left:52px;top:172px;width:229px;height:41px;font-family:'Bakbak One',sans-serif;font-size:30px;color:#FFFFFF;display:flex;align-items:center;user-select:none}

#playersRoot{left:335px;top:0;width:1439px;height:250px;overflow:hidden}
#playerSlider{position:absolute;left:0;top:0;width:2200px;height:250px;transition:none}
#playerSlider.sliding{transition:transform 5s linear}

.p-bg{position:absolute;top:44px;width:160px;height:160px;background:#7235E6;overflow:hidden}
.p-bg .p-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.p-bg.has-img .p-bg-img{display:block}
.p-img-wrap{position:absolute;top:44px;width:160px;height:160px;overflow:hidden}
.p-img-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;display:none}
.p-img-wrap.has-img img{display:block}

.p-name{position:absolute;top:107px;width:160px;height:34px;display:flex;align-items:center}
.p-name-text{font-family:'Bakbak One',sans-serif;font-size:22px;color:#FFFFFF;text-transform:uppercase;white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
<div class="overlay" id="overlay">
  <img class="overlay-bg-img" id="overlayBgImg" alt="">
  <div class="panel-left"  id="panelLeft" ><img class="panel-img" id="panelLeftImg"  alt=""></div>
  <div class="panel-right" id="panelRight"><img class="panel-img" id="panelRightImg" alt=""></div>
  <div class="content-fade" id="contentFade">
    <div class="team-logo" id="teamLogo">
      <img class="logo-img" id="teamLogoImg" alt="Team Logo">
    </div>
    <div class="team-name-el"><div class="team-name-text" id="teamNameEl">IQOO SOUL</div></div>
    <div class="team-lineup-el" id="teamLineupEl">TEAM LINEUP</div>
    <div id="playersRoot"><div id="playerSlider"></div></div>
  </div>
</div>

<script>
var BG_X_OFFSET=133;
var playerBgXs=[-92,272,637,1002,1367];
var playerNameXs=[91,456,821,1179,1541];
var defaultNames=["SOULNAKUL","SOULLEGIT","SOULGOBLIN","SOULJOKER","SOULTHUNDER"];
var pSlider=document.getElementById('playerSlider');
var playerWraps=[], playerBgEls=[], playerNameEls=[];

playerBgXs.forEach(function(rawBgX,i){
  var bgLeft=rawBgX+BG_X_OFFSET, nameLeft=playerNameXs[i]+BG_X_OFFSET;

  var bgBox=document.createElement('div'); bgBox.className='p-bg'; bgBox.style.left=bgLeft+'px';
  var bgBoxImg=document.createElement('img'); bgBoxImg.className='p-bg-img'; bgBox.appendChild(bgBoxImg);
  pSlider.appendChild(bgBox);
  playerBgEls.push(bgBox);

  var wrap=document.createElement('div'); wrap.className='p-img-wrap'; wrap.style.left=bgLeft+'px';
  var img=document.createElement('img'); img.alt=defaultNames[i]; wrap.appendChild(img);
  pSlider.appendChild(wrap);
  playerWraps.push(wrap);

  var nameDiv=document.createElement('div'); nameDiv.className='p-name'; nameDiv.style.left=nameLeft+'px';
  var nt=document.createElement('div'); nt.className='p-name-text'; nt.textContent=defaultNames[i];
  nameDiv.appendChild(nt); pSlider.appendChild(nameDiv);
  playerNameEls.push(nt);
});

/* ══ BroadcastChannel ══ */
var ch = new BroadcastChannel('iqoo_soul_overlay');
ch.onmessage = function(e){
  var msg = e.data;
  if(!msg) return;
  switch(msg.type){
    case 'FADE': handleFade(msg.state); break;
    case 'SLIDE_LEFT': doSlide(); break;
    case 'SLIDE_RESET': resetSlider(); break;
    case 'TEAM_DATA': applyTeamData(msg.data); break;
    case 'COLOR': applyColor(msg.key, msg.value); break;
    case 'IMAGE': applyImage(msg.key, msg.dataUrl); break;
    case 'PLAYER_IMAGE': applyPlayerImage(msg.index, msg.dataUrl, msg.bgDataUrl); break;
    case 'PING': ch.postMessage({type:'PONG'}); break;
  }
};

// Notify control panel when ready
window.addEventListener('load', function(){
  ch.postMessage({type:'OVERLAY_READY'});
});

function handleFade(state){
  var f = document.getElementById('contentFade');
  if(state==='out') f.classList.add('fading');
  else f.classList.remove('fading');
}

function doSlide(){
  var ps = document.getElementById('playerSlider');
  ps.classList.add('sliding');
  ps.style.transform='translateX(-364px)';
}

function resetSlider(){
  var ps = document.getElementById('playerSlider');
  ps.classList.remove('sliding');
  ps.style.transform='translateX(0)';
}

function applyTeamData(data){
  document.getElementById('teamNameEl').textContent = data.teamName || '';
  for(var i=0;i<playerNameEls.length;i++){
    playerNameEls[i].textContent = (data.players&&data.players[i]) || '';
  }
  var logoImg = document.getElementById('teamLogoImg');
  var logoWrap = document.getElementById('teamLogo');
  if(data.logoDataUrl){
    logoImg.src = data.logoDataUrl;
    logoImg.onload = function(){ logoWrap.classList.add('has-img'); };
    logoImg.onerror = function(){ logoWrap.classList.remove('has-img'); };
  } else {
    logoImg.src=''; logoWrap.classList.remove('has-img');
  }
}

function applyColor(key, val){
  switch(key){
    case 'mainBg': document.getElementById('overlay').style.background=val; break;
    case 'leftPanel': document.getElementById('panelLeft').style.background=val; break;
    case 'rightPanel': document.getElementById('panelRight').style.background=val; break;
    case 'playerBg': document.querySelectorAll('.p-bg').forEach(function(el){el.style.background=val;}); break;
    case 'teamName': document.getElementById('teamNameEl').style.color=val; break;
    case 'lineup': document.getElementById('teamLineupEl').style.color=val; break;
    case 'playerNames': playerNameEls.forEach(function(el){el.style.color=val;}); break;
  }
}

function applyImage(key, dataUrl){
  if(key==='overlayBg'){
    var el=document.getElementById('overlayBgImg'), c=document.getElementById('overlay');
    if(dataUrl){el.src=dataUrl;c.classList.add('has-bg-img');}
    else{el.src='';c.classList.remove('has-bg-img');}
  } else if(key==='leftPanel'){
    var el=document.getElementById('panelLeftImg'), c=document.getElementById('panelLeft');
    if(dataUrl){el.src=dataUrl;c.classList.add('has-img');}
    else{el.src='';c.classList.remove('has-img');}
  } else if(key==='rightPanel'){
    var el=document.getElementById('panelRightImg'), c=document.getElementById('panelRight');
    if(dataUrl){el.src=dataUrl;c.classList.add('has-img');}
    else{el.src='';c.classList.remove('has-img');}
  }
}

function applyPlayerImage(idx, dataUrl, bgDataUrl){
  if(idx<0||idx>=playerWraps.length) return;
  var wrap=playerWraps[idx], img=wrap.querySelector('img');
  if(dataUrl){img.src=dataUrl;wrap.classList.add('has-img');}
  else{img.src='';wrap.classList.remove('has-img');}
  if(bgDataUrl!==undefined){
    var bgEl=playerBgEls[idx], bgImg=bgEl.querySelector('.p-bg-img');
    if(bgDataUrl){bgImg.src=bgDataUrl;bgEl.classList.add('has-img');}
    else{bgImg.src='';bgEl.classList.remove('has-img');}
  }
}
</script>
</body>
</html>
